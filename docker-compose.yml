services:

  nginx:
    build:
      context: ./site-nginx
    container_name: nginx_tp
    ports:
      - "8080:80"

  apache:
    image: httpd:latest
    container_name: apache_tp
    ports:
      - "8081:80"
    volumes:
      - ./site-apache/index.html:/usr/local/apache2/htdocs/index.html